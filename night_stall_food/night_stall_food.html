<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Food Notes - Tina</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Prefetch homepage background so it's cached when navigating back -->
    <link rel="prefetch" href="../images/site/background.jpg" as="image">

    <link rel="stylesheet" href="../styles.css?v=notebook-1">
    <script src="../darkmode.js?v=notebook-1"></script>

    <!-- Restore the saved color theme before first paint -->
    <script>
        (function() {
            let theme = 'mint';
            try { theme = localStorage.getItem('tinaTheme') || theme; } catch (_) {}
            if (!['mint', 'sky', 'peach', 'lavender', 'cream'].includes(theme)) theme = 'mint';
            document.documentElement.dataset.theme = theme;
        })();
    </script>
</head>
<body class="inner-page">

    <header>
        <a href="../index.html" class="logo">Tina's Little World</a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../food_gallery/food_gallery.html" aria-current="page">Food Diary</a>
            <a href="../kitchen/index.html">My Kitchen</a>
            <a href="../blogs/blogs.html">Journal</a>
            <a href="../projects/projects.html">Projects & Research</a>
            <button id="dark-mode-toggle" aria-label="Change color theme">Mint</button>
        </nav>
    </header>

    <main class="hero inner-page">
        <div class="page-content wide">
            <h2 class="page-title">Street Food Notes</h2>
            <p>A collection within my Food Diary — street bites I love and how they’re made.</p><p><a class="collection-back" href="../food_gallery/food_gallery.html">Food Diary shelf</a></p>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="food-search" placeholder="Search street foods..." aria-label="Search street foods">
                <i class="fas fa-search search-icon"></i>
            </div>

            <!-- Food Grid - cards loaded dynamically from data.json -->
            <div class="food-grid" id="food-grid">
                <!-- Cards will be loaded dynamically -->
            </div>

            <p id="no-results" class="no-results" style="display: none;">No street foods found matching your search.</p>
        </div>
    </main>

    <script>
        // Load cards dynamically from data.json
        const foodGrid = document.getElementById('food-grid');
        const searchInput = document.getElementById('food-search');
        const noResults = document.getElementById('no-results');

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                // Render cards
                data.forEach(item => {
                    const card = document.createElement('a');
                    card.href = item.href;
                    card.className = 'food-card';
                    card.setAttribute('data-name', item.searchTerms);
                    const visual = item.image
                        ? `<img class="food-image" src="${item.image}" alt="${item.title}">`
                        : `<div class="food-emoji">${item.emoji}</div>`;
                    card.innerHTML = `
                        ${visual}
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                    `;
                    foodGrid.appendChild(card);
                });

                // Setup search after cards are loaded
                setupSearch();
            })
            .catch(err => console.error('Failed to load data:', err));

        function setupSearch() {
            const foodCards = document.querySelectorAll('.food-card');

            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                let visibleCount = 0;

                foodCards.forEach(card => {
                    const foodName = card.getAttribute('data-name').toLowerCase();
                    const title = card.querySelector('h3').textContent.toLowerCase();
                    const description = card.querySelector('p').textContent.toLowerCase();

                    if (foodName.includes(searchTerm) || title.includes(searchTerm) || description.includes(searchTerm)) {
                        card.style.display = '';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                noResults.style.display = visibleCount === 0 ? 'block' : 'none';
            });
        }
    </script>
<script src="../photo-journal.js?v=notebook-1" defer></script>
</body>
</html>
