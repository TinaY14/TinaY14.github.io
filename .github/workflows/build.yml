name: Build and Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build HTML files
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/night_stall_food deploy/food_gallery deploy/projects deploy/images deploy/blogs
          cp index.html styles.css darkmode.js script.js veggies.js projects.html Xitian_Tina__Yu_resume_sophomore_.pdf deploy/
          cp -r night_stall_food/* deploy/night_stall_food/
          cp -r food_gallery/* deploy/food_gallery/
          cp -r projects/* deploy/projects/
          cp -r images/* deploy/images/
          cp -r blogs/* deploy/blogs/
          touch deploy/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
