name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Generate timeline data
        run: node scripts/generate-timeline.js

      - name: Build HTML files
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/night_stall_food deploy/food_gallery deploy/projects deploy/images deploy/blogs deploy/kitchen deploy/fonts deploy/fonts
          cp index.html styles.css darkmode.js photo-journal.js film-gallery.js film-gallery.css script.js veggies.js projects.html Xitian_Tina__Yu_resume_sophomore_.pdf deploy/
          cp -r night_stall_food/* deploy/night_stall_food/
          cp -r food_gallery/* deploy/food_gallery/
          cp -r projects/* deploy/projects/
          cp -r images/* deploy/images/
          cp -r blogs/* deploy/blogs/
          cp -r kitchen/* deploy/kitchen/
          cp -r fonts/* deploy/fonts/
          cp -r fonts/* deploy/fonts/
          touch deploy/.nojekyll

      - name: Upload site artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: deploy
          retention-days: 7

      - name: Confirm artifact upload
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$PAGES_ARTIFACT_ID"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_config=$(gh api "repos/$GITHUB_REPOSITORY/pages")
          pages_mode=$(printf '%s' "$pages_config" | jq -r '.build_type')
          pages_branch=$(printf '%s' "$pages_config" | jq -r '.source.branch // "none"')
          echo "::notice title=GitHub Pages source::build_type=$pages_mode source_branch=$pages_branch"
          if [ "$pages_mode" != "workflow" ]; then
            echo "::error title=Pages source mismatch::Open repository Settings > Pages and set Build and deployment > Source to GitHub Actions."
            exit 1
          fi

      - name: Publish GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages


      - name: Wait before retrying Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: retry_deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Verify live Journal layout and font
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base = os.environ["PUBLISHED_URL"].rstrip("/") + "/"
          revision = os.environ["GITHUB_SHA"]
          article_url = urljoin(base, "blogs/2026-03-04-volunteering-in-the-teaching-kitchen-we-tried-fried-bananas.html")

          def read(url):
              separator = "&" if "?" in url else "?"
              request = Request(url + separator + "verify=" + revision, headers={"Cache-Control": "no-cache"})
              with urlopen(request, timeout=20) as response:
                  return response.read()

          for attempt in range(12):
              try:
                  article = read(article_url).decode()
                  assert 'class="journal-notebook"' in article, "Notebook markup is missing"
                  assert 'class="article-title-row"' in article, "Article is still an older release"
                  stylesheet = re.search(r'href="([^"]*styles\.css[^"]*)"', article)
                  assert stylesheet, "Stylesheet link is missing"
                  css = read(urljoin(article_url, stylesheet.group(1))).decode()
                  assert "font-family:'Caveat'" in css, "Handwritten typography is missing"
                  assert "text-indent:2em" in css, "Paragraph indentation is missing"
                  font = read(urljoin(base, "fonts/caveat-variable.ttf"))
                  assert font[:4] == b"\x00\x01\x00\x00", "The font URL did not return a TrueType font"
                  print("::notice title=Live Journal verified::Current notebook layout, stylesheet and Caveat font are available on the published website.")
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print("Waiting for published files:", str(error), flush=True)
                  time.sleep(10)
          PY
