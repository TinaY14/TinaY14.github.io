name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build HTML files
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/night_stall_food deploy/food_gallery deploy/projects deploy/images deploy/blogs deploy/kitchen
          cp index.html styles.css darkmode.js photo-journal.js script.js veggies.js projects.html Xitian_Tina__Yu_resume_sophomore_.pdf deploy/
          cp -r night_stall_food/* deploy/night_stall_food/
          cp -r food_gallery/* deploy/food_gallery/
          cp -r projects/* deploy/projects/
          cp -r images/* deploy/images/
          cp -r blogs/* deploy/blogs/
          cp -r kitchen/* deploy/kitchen/
          touch deploy/.nojekyll

      - name: Upload site artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: deploy
          retention-days: 7

      - name: Confirm artifact upload
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$PAGES_ARTIFACT_ID"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
